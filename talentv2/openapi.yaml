          $ref: '#/components/responses/EventDeferredNotification'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Default'
    patch:
      operationId: UpdateEventDeferredNotification
      summary: Изменение отложенного уведомления
      description: |-
        Если уведомление уже существует и оно находится в статусе `canceled`,
        оно будет переведено в статус `pending`.
      tags: [events-deferred-notification]
      security:
