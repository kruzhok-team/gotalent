# vim: fdl=1
openapi: 3.1.0
info:
  title: Talent API v2
  version: '0.12-minor'
  contact:
    email: talent@kruzhok.org
servers:
  - url: https://talent.kruzhok.org/v2
    description: Production Server
  - url: https://talent.test.kruzhok.org/v2
    description: Development Server

paths:
  /auth/login/{provider}:
    parameters:
      - $ref: '#/components/parameters/social_auth_provider'
      - name: next
        in: query
        schema:
          type: string
          description: Адрес перенаправления после завершения авторизации
      - name: reg_next
        in: query
        schema:
          type: string
          description: Адрес перенаправления для заполнения формы регистрации
      - name: err_next
        in: query
        schema:
          type: string
          description: Адрес перенаправления при завершении авторизации ошибкой
    get:
      # TODO: Cache-Control: no-store, no-cache, must-revalidate; Pragma: no-cache; Expires: 0
      operationId: LoginSocialAuth
      summary: Авторизация во внешнем провайдере
      tags: [social-auths]
      responses:
        '200':
          description: Провайдер не имеет страницы подтверждения
          content:
            text/plain:
              schema: {type: string, description: Значение параметра state}
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetCookie'}
        '302':
          description: Перенаправление на страницу подтверждения авторизации
          headers:
            Location: {required: true, schema: {type: string}}
            Set-Cookie: {$ref: '#/components/headers/SetCookie'}
        '403':
          $ref: '#/components/responses/SocialAuthForbidden'
        default:
          $ref: '#/components/responses/Error'

  /auth/complete/{provider}:
    parameters:
      - $ref: '#/components/parameters/social_auth_provider'
      - name: state
        in: query
        required: true
        schema: {type: string}
      - name: csrf_state
        in: cookie
        schema: {type: string}
    get:
      # TODO: Cache-Control: no-store, no-cache, must-revalidate; Pragma: no-cache; Expires: 0
      operationId: CompleteSocialAuth
      summary: Завершение авторизации
      tags: [social-auths]
      responses:
        '302':
          description: Дальнейшее перенаправление
          headers:
            Location:
              {required: true, schema: {type: string}}
            Set-Cookie: {$ref: '#/components/headers/SetCookie'}
        '403':
          $ref: '#/components/responses/SocialAuthForbidden'
        default:
          $ref: '#/components/responses/Error'

  /auth/disconnect/{provider}/{uid}:
    parameters:
      - $ref: '#/components/parameters/social_auth_provider'
      - name: uid
        in: path
        required: true
        description: Внешний идентификатор пользователя
        schema: {type: string}
    post:
      operationId: DisconnectSocialAuth
      summary: Удаление авторизации
      description: |-
        Удаление авторизации возможно только если это не единственный оставшийся у пользователя способ аутентификации под своей учетной записью.

        Не допускается параллельная обработка запросов на удаление, в случае появления такой гонки, будет возвращен 409 ответ.
      security: [TalentOAuth: [user]]
      tags: [social-auths]
      responses:
        '204':
          description: Данные об авторизации успешно удалены
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'

  /auth/signup:
    get:
      # TODO: Cache-Control: no-store, no-cache, must-revalidate; Pragma: no-cache; Expires: 0
      operationId: SignupInitialData
      summary: Данные для предзаполнения формы регистрации
      tags: [user-signup]
      parameters:
        - {name: partial_token, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Данные найдены
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: boolean
        '204':
          description: Данные отсутствуют
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: Signup
      summary: Регистрация пользователя
      tags: [user-signup]
      parameters:
        - {name: partial_token, in: query, schema: {type: string, format: uuid}}
        - {name: utm, in: cookie, schema: {type: string}}
      requestBody: {$ref: '#/components/requestBodies/Signup'}
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetCookie'}
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int32
                  expires_in:
                    type: integer
                    format: int32
                  reg_token:
                    type: string
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        '501':
          $ref: '#/components/responses/NotImplemented'
        default:
          $ref: '#/components/responses/Error'

  /auth/confirm-email/{uid}/{token}:
    parameters:
      - {name: uid, in: path, required: true, schema: {type: string}}
      - {name: token, in: path, required: true, schema: {type: string}}
    post:
      operationId: ConfirmSignupEmail
      summary: Завершение регистрации пользователя подтверждением почты
      tags: [user-signup]
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetCookie'}
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        '501':
          $ref: '#/components/responses/NotImplemented'
        default:
          $ref: '#/components/responses/Error'

  /files:
    get:
      operationId: ListFileMeta
      summary: Список файлов
      description: |-
        #### Неаутентифицированный запрос публичных файлов

        Допускается запрос без аутентификации при соблюдении условий:
          - присутствуют значения параметра `file_id`
          - параметр `is_public` отсутствует либо содержит `true`

        При несоблюдении какого-либо из условий, возвращается `401` ответ.
      tags: [generic-files]
      security: [TalentOAuth: [files:read], {}]
      parameters:
        - name: file_id
          in: query
          description: Чтение метаинформации конкретных файлов. Значения указываются через запятую.
          explode: false
          schema: {type: array, maxItems: 30, items: {type: string, format: uuid}}
        - name: is_public
          in: query
          description: Статус публичности файла.
          schema: {type: boolean}
        - name: namespace
          in: query
          description: |-
            Пространство имен для объекта, где используется файл, в формате
            <сервис>/<таблица БД>/<поле со ссылкой на файл>
            (например, polls/questions/picture, venues/venue/cover, etc.)
          schema: {type: string}
        - name: namespace_startswith
          in: query
          description: Фильтрация по префиксной подстроке в пространстве имен.
          schema: {type: string, minLength: 3}
        - name: name_like
          in: query
          description: Фильтрация по подстроке в имени файла.
          schema: {type: string, minLength: 3}
        - name: ext
          in: query
          description: Фильтрация по точному совпадению расширения.
          schema: {type: string}
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - name: order_by
          in: query
          description: Поле, по которому будет отсортирован список файлов.
          schema:
            type: string
            default: created_at_desc
            enum:
              - created_at_asc
              - created_at_desc
              - uploaded_at_asc
              - uploaded_at_desc
              - file_id
      responses:
        '200':
          description: OK
          headers:
            X-Count: {$ref: '#/components/headers/X-Count'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/FileMeta'}}
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: CreateFileMeta
      summary: Создание файла
      tags: [generic-files]
      security: [TalentOAuth: [files]]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - namespace
                - content_type
                - content_length
              properties:
                namespace:
                  type: string
                  description: |-
                    Пространство имен для объекта, где используется файл, в формате
                    <сервис>/<таблица БД>/<поле со ссылкой на файл>
                    (например, polls/questions/picture, venues/venue/cover, etc.)
                is_public:
                  type: boolean
                  description: Статус публичности файла.
                  default: false
                extension:
                  type: string
                  pattern: '^\.[a-zA-Z0-9]+$'
                  minLength: 2
                  maxLength: 10
                  description: Расширение файла (например, .jpg, .png, .pdf, etc.)
                content_type:
                  type: string
                  description: MIME-тип файла.
                content_length: {$ref: '#/components/schemas/ContentLength'}
                name: {$ref: '#/components/schemas/FileMetaName'}
      responses:
        '201':
          description: Метаданные файла добавлены, ссылка на загрузку сформирована.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FileMeta'
                  - $ref: '#/components/schemas/FilePresignedRequest'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '422':
          $ref: '#/components/responses/UnproccessableEntity'
        default:
          $ref: '#/components/responses/Error'

  /files/{file_id}:
    get:
      operationId: ReadFile
      summary: Получение ссылки на файл
      description: |-
        По-умолчанию возвращается в форме `307` ответа.
        С параметром `noredir=true` возвращается `200`.

        Чтение приватного файла требует прохождения авторизации.
        Аутентифицированный пользователь должен быть владельцем файла.
        Токен должен иметь скоуп `files:read`.
      tags: [generic-files]
      security: [TalentOAuth: [], {}]
      parameters:
        - {name: noredir, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Ссылка на файл
          content:
            application/json:
              schema: {type: string, format: uri}
        '307':
          description: Перенаправление на файл в хранилище
          headers:
            Location:
              required: true
              description: URL файла в хранилище
              schema: {type: string, format: uri}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: UploadFile
      summary: Создание запроса на загрузку файла
      description: |-
        Позволяет повторно получить ссылку на загрузку того же файла или сформировать
        ссылку для загрузки новой версии файла (того же типа, но другого размера).
      tags:
        - generic-files
      security:
        - TalentOAuth: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content_length
              properties:
                content_length:
                  $ref: '#/components/schemas/ContentLength'
      responses:
        '200':
          description: Предподписанный запрос на загрузку файла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePresignedRequest'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '422':
          description: Файл заблокирован и недоступен для изменения
        default:
          $ref: '#/components/responses/Error'
    parameters:
      - name: file_id
        in: path
        required: true
        description: ID файла
        schema:
          type: string
          format: uuid

  /files/{file_id}/meta:
    get:
      operationId: ReadFileMeta
      summary: Чтение информации о файле
      description: |-
        Чтение приватного файла требует прохождения авторизации.
        Аутентифицированный пользователь должен быть владельцем файла.
        Токен должен иметь скоуп `files:read`.
      tags:
        - generic-files
      security:
        - TalentOAuth: []
        - {}
      responses:
        '200':
          description: Информация о файле
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: UpdateFileMeta
      summary: Обновление информации о файле
      tags:
        - generic-files
      security:
        - TalentOAuth: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/FileMetaName'
      responses:
        '200':
          description: Файл обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMeta'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    parameters:
      - name: file_id
        in: path
        required: true
        description: ID файла.
        schema:
          type: string
          format: uuid

  /files/{file_id}/confirm-upload:
    post:
      operationId: ConfirmFileUpload
      summary: Подтверждение загрузки файла
      tags:
        - generic-files
      security:
        - TalentOAuth: [files]
      responses:
        '200':
          description: Файл отмечен загруженным, счетчик версий обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMeta'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    parameters:
      - name: file_id
        in: path
        required: true
        description: ID файла.
        schema:
          type: string
          format: uuid

  /files/{file_id}/references/{object_id}:
    put:
      operationId: CreateFileReference
      summary: Добавление ссылки на файл
      tags:
        - generic-files
      security:
        - TalentOAuth: [files]
      responses:
        '200':
          description: Ссылка на файл добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileReference'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteFileReference
      summary: Удаление ссылки на файл
      tags:
        - generic-files
      security:
        - TalentOAuth: [files]
      responses:
        '204':
          description: Ссылка на файл удалена
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    parameters:
      - name: file_id
        in: path
        required: true
        description: ID файла
        schema:
          type: string
          format: uuid
      - name: object_id
        in: path
        required: true
        description: ID связанного объекта
        schema:
          type: string
          maxLength: 36

  /events:
    head:
      operationId: CountEvents
      summary: Счетчик мероприятий
      tags: [events-read]
      parameters:
        - $ref: '#/components/parameters/event_ids'
        - $ref: '#/components/parameters/event_organization_id'
        - $ref: '#/components/parameters/event_meta_event_id'
        - $ref: '#/components/parameters/event_venue_id'
        - $ref: '#/components/parameters/event_start_before'
        - $ref: '#/components/parameters/event_end_after'
        - $ref: '#/components/parameters/event_search'
        - $ref: '#/components/parameters/event_format'
      responses:
        '200':
          description: OK
          headers:
            X-Count:
              required: true
              description: Количество входящих в выборку объектов.
              schema:
                type: integer
                format: int64
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: ListEvents
      summary: Список мероприятий
      description: |-
        Если не указан критерий сортировки результатов `order_by`,
        то он определяется в зависимости от указания других параметров.

        По-умолчанию результаты сортируются по идентификаторам в порядке возрастания (`id_asc`).
        Но если указан поисковый запрос и не используется параметр `id_offset`,
        то результаты сортируются по релевантности к поисковому запросу (`relevant`).

        При явном указании `order_by`, его значение должно соответствовать требованиям:
          - с параметром `id_offset` допускается только `order_by=id_asc`
          - вариант `order_by=relevant` доступен только при указании параметра `search`.
      tags: [events-read]
      parameters:
        - $ref: '#/components/parameters/event_ids'
        - $ref: '#/components/parameters/event_organization_id'
        - $ref: '#/components/parameters/event_meta_event_id'
        - $ref: '#/components/parameters/event_venue_id'
        - $ref: '#/components/parameters/event_start_before'
        - $ref: '#/components/parameters/event_end_after'
        - $ref: '#/components/parameters/event_search'
        - $ref: '#/components/parameters/event_format'
        - $ref: '#/components/parameters/id_offset_32'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - name: order_by
          in: query
          schema:
            type: string
            enum:
              - relevant
              - id_asc
              - id_desc
      responses:
        '200':
          $ref: '#/components/responses/ListEvents'
        '422':
          $ref: '#/components/responses/UnproccessableEntity'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: CreateEvent
      summary: Добавление нового мероприятия
      security: [TalentOAuth: [events]]
      tags: [events-manage]
      description: |-
        При полном отсутствии в запросе массива `achievement_roles`,
        мероприятию назначаются роли достижений по-умолчанию.
        Пустой же массив приведет к созданию мероприятия без ролей.
      requestBody: {$ref: '#/components/requestBodies/EventCreate'}
      responses:
        '201':
          description: Мероприятие создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        default:
          $ref: '#/components/responses/Error'

  /events/addachievement:
    get:
      operationId: ListAddAchievementEvents
      summary: Список мероприятий для добавленя достижения
      description: Мероприятия, доступные для добавления достижения пользователем.
      tags: [events-read]
      parameters:
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/event_search'
        - $ref: '#/components/parameters/event_ids'
        - $ref: '#/components/parameters/event_format'
        - $ref: '#/components/parameters/event_start_before'
        - $ref: '#/components/parameters/event_end_after'
        - $ref: '#/components/parameters/brand_ids'
        - $ref: '#/components/parameters/competency_ids'
        - $ref: '#/components/parameters/region'
      responses:
        '200':
          $ref: '#/components/responses/ListAddAchievementEvents'
        default:
          $ref: '#/components/responses/Error'

  /events/calendar:
    get:
      operationId: ListCalendarEvents
      summary: Список мероприятий для календаря
      tags: [events-read]
      parameters:
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - name: order_by
          in: query
          description: Критерий сортировки результатов.
          schema:
            type: string
            default: start_asc
            enum:
              - start_asc
              - start_desc
              - title_asc
              - title_desc
      responses:
        '200':
          $ref: '#/components/responses/ListCalendarEvents'
        default:
          $ref: '#/components/responses/Error'

  /events/organizations/{organization_id}:
    get:
      operationId: ListOrganizationEvents
      summary: Список мероприятий организации
      tags: [events-read]
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/event_ids'
        - $ref: '#/components/parameters/event_search'
        - $ref: '#/components/parameters/event_format'
        - $ref: '#/components/parameters/event_start_before'
        - $ref: '#/components/parameters/event_end_after'
        - $ref: '#/components/parameters/city'
        - name: order_by
          in: query
          description: |-
            Критерий сортировки результатов.

            При использовании текстового поиска,
            результаты будут отсортированы сначала в порядке релевантности,
            а потом в соответствии с указанным этим параметром критерием.
          schema:
            type: string
            default: 'start_desc'
            enum:
              - start_asc
              - start_desc
              - title_asc
              - title_desc
      responses:
        '200':
