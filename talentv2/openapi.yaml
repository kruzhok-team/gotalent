      parameters:
        - $ref: '#/components/parameters/event_ids'
        - $ref: '#/components/parameters/route_ids'
        - $ref: '#/components/parameters/id_offset_32'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          $ref: '#/components/responses/ListEventRoutes'
        default:
          $ref: '#/components/responses/Default'
  /mutation-locks/{object_namespace}/{object_key}:
    parameters:
      - $ref: '#/components/parameters/mutation_lock_object_namespace'
      - $ref: '#/components/parameters/mutation_lock_object_key'
    post:
      operationId: CreateMutationLock
      summary: Блокировка файлов от изменений
      description: |-
        Блокировки создаются только для файлов, принадлежащих пользователю.
        Чужие файлы, несуществующие файлы, а так же файлы,
        для которых блокировки уже имеются,
        будут пропущены и не возвращены в теле `201` ответа.
      tags: [mutation-locks]
      security:
        - TalentOAuth: [files]
      requestBody: {$ref: '#/components/requestBodies/MutationLockCreate'}
      responses:
        '201':
          description: Идентификаторы файлов, для которых были созданы блокировки.
          content: {application/json: {schema: {$ref: '#/components/schemas/UUIDs'}}}
        '204':
          description: Ни один файл не был заблокирован.
        '409':
          description: Конфликтный запрос создания блокировки.
        '422':
          description: Указан невалидный object_namespace.
        default:
          $ref: '#/components/responses/Default'
    patch:
      operationId: PatchMutationLock
      summary: Изменение состояния блокировки
      description: |-
        Изначально блокировка создается в состоянии активной.
        После создания, состояние можно декактивировать и активировать обратно.

        > Неактивная блокировка равнозначна ее отсутствию.
      tags: [mutation-locks]
      security:
        - ClientCredentials: []
      requestBody: {$ref: '#/components/requestBodies/MutationLockPatch'}
      responses:
        '200':
          $ref: '#/components/responses/MutationLockPatched'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'
    delete:
      operationId: DeleteMutationLock
      summary: Удаление блокировки
      tags: [mutation-locks]
      security:
        - ClientCredentials: []
      responses:
        '204':
          description: Блокировка удалена
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'

  /oauth/authorize:
    get:
      operationId: ValidateAuthorization
      summary: Валидация авторизационных параметров
      security: [TalentOAuth: []]
      tags: [oauth]
      parameters:
        - {name: response_type, in: query, required: true, schema: {type: string}}
        - {name: redirect_uri, in: query, required: true, schema: {type: string}}
        - {name: client_id, in: query, required: true, schema: {type: string}}
        - {name: scope, in: query, schema: {type: string}}
        - {name: auto_renew, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Ok
        default:
          $ref: '#/components/responses/Default'

    post:
      operationId: AuthorizeClient
      summary: Авторизация клиента
      description: Пользователь авторизует доступ клиента к ресурсам пользователя
      security: [TalentOAuth: []]
      tags: [oauth]
      responses:
        '302':
          description: Ok
          headers:
            Location: {required: true, schema: {type: string}}
        default:
          $ref: '#/components/responses/Default'

  /oauth/issue-token:
    post:
      operationId: IssueAccessToken
      summary: Выдача токена доступа
      tags: [oauth]
      responses:
        '200': {$ref: '#/components/responses/IssueTokenSuccess'}
        '400': {$ref: '#/components/responses/IssueTokenError'}
        default:
          $ref: '#/components/responses/Default'

  /organization-subjects:
    get:
      operationId: ListOrganizationSubjects
      summary: Список связей организаций и тематик
      tags: [organization-subjects]
      parameters:
        - $ref: '#/components/parameters/id_offset_32'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/organization_ids'
        - $ref: '#/components/parameters/subject_ids'
      responses:
        '200':
          $ref: '#/components/responses/ListOrganizationSubjects'
        default:
          $ref: '#/components/responses/Default'
    post:
      operationId: CreateOrganizationSubject
      summary: Добавление тематики для организации
      description: |-
        > Запрос необходимо выполнять от ментора или владельца организации,
        > указываемой в свойстве `organization_id` тела запроса.
      security: [TalentOAuth: [events]]
      tags: [organization-subjects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationSubjectBody'
      responses:
        '201':
          description: Тематика добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSubject'
        '403':
          description: Пользователь не имеет административных прав в организаци
        '409':
          description: Тематика уже добавлена в организацию
        default:
          $ref: '#/components/responses/Default'
  /organizations:
    get:
      operationId: ListOrganizations
      summary: Список организаций
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/organization_ids'
        - $ref: '#/components/parameters/parent_organization_id'
        - $ref: '#/components/parameters/id_offset_32'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - name: order_by
          in: query
          description: Критерий сортировки результатов.
          schema:
            type: string
            default: 'id_asc'
            enum:
              - id_asc
              - id_desc
      responses:
        '200':
          $ref: '#/components/responses/ListOrganizations'
        '422':
          $ref: '#/components/responses/UnproccessableEntity'
        default:
          $ref: '#/components/responses/Default'
  /organizations/{organization_id}/is-admin:
    post:
      operationId: IsOrganizationAdmin
      summary: Проверка наличия административных прав в организации
      security:
        - TalentOAuth: []
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - name: is_owner
          in: query
          description: |-
            Требование наличия или отсутствия статуса владельца организации.

            При указании значения, роль пользователя должна ему соответствовать;
            это значит что если указать `false`, а пользователь является владельцем,
            то ответ будет иметь статус `403`.
          schema:
            type: boolean
      responses:
        '200':
          description: Права администратора имеются
        '403':
          description: Права отсутствуют
        '404':
          description: Организация не найдена
        default:
          $ref: '#/components/responses/Default'
  /persons/{person_id}:
    get:
      operationId: ReadPerson
      summary: Чтение персоны пользователя
      tags:
        - persons
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - user_id
                properties:
                  user_id:
                    type: integer
                    format: int32
                    description: TalentID пользователя, которому принадлежит персона.
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'
    parameters:
      - name: person_id
        in: path
        required: true
        description: ID персоны.
        schema:
          type: integer
          format: int32
  /social-auths/{user_id}:
    get:
      operationId: ListSocialAuths
      summary: Список авторизаций пользователя в соц. сетях
      security:
        - TalentOAuth: [user:read]
        - ClientCredentials: []
      tags:
        - social-auths
      parameters:
        - name: provider
          in: query
          required: false
          description: Фильтрация по провайдеру авторизации
          schema:
            $ref: '#/components/schemas/SocialAuthProvider'
        - $ref: '#/components/parameters/id_offset_32'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Ok
          headers:
            X-Count:
              $ref: '#/components/headers/X-Count'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocialAuth'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        default:
          $ref: '#/components/responses/Default'
    parameters:
      - name: user_id
        in: path
        required: true
        description: ID пользователя.
        schema:
          type: integer
          format: int32
  /subjects:
    get:
      operationId: ListSubjects
      summary: Список тематик для организаций
      tags: [organization-subjects]
      parameters:
        - $ref: '#/components/parameters/id_offset_32'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          $ref: '#/components/responses/ListSubjects'
        default:
          $ref: '#/components/responses/Default'
  /teams/{team_id}:
    get:
      operationId: ReadTeam
      summary: Чтение параметров команды
      description: |-
        Часть данных возвращается только при наличии аутентификации и определенных прав у пользователя,
        от лица которого выполняется запрос.
      tags:
        - teams
      security:
        - TalentOAuth: [teams:read]
        - {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'
    patch:
      operationId: UpdateTeam
      summary: Обновление параметров команды
      description: Доступно только для капитана команды и организатора мероприятия.
      tags:
        - teams
      security:
        - TalentOAuth: [teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 255
                description:
                  type: string
                  maxLength: 2000
                assignment_participation:
                  type: boolean
                  description: Команда участвует в автораспределении.
                project_id:
                  type: integer
                  format: int32
                  description: |-
                    ID проекта команды.

                    > Доступно для обновления только капитану команды.
                contact_link:
                  $ref: '#/components/schemas/TeamContactLink'
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Контактная ссылка не прошла валидацию
          $ref: '#/components/responses/ErrorResponse'
        default:
          $ref: '#/components/responses/Default'
    parameters:
      - name: team_id
        in: path
        required: true
        description: ID команды.
        schema:
          type: integer
          format: int32
  /teams/contact-validate:
    post:
      operationId: ValidateTeamContact
      summary: Валидация контактной ссылки
      tags:
        - teams
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamContactLink'
      responses:
        '200':
          description: Ссылка корректна для использования в качестве контактной ссылки команды
          x-summary: Ссылка прошла валидацию
        '422':
          description: Ссылка не прошла валидацию
        default:
          $ref: '#/components/responses/Default'

  /users/me:
    patch:
      operationId: UpdateAuthenticatedUser
      summary: Изменение аутентифицированного пользователя
      description: "> Операция еще не доступна"
      tags: [user-profile]
      requestBody: {$ref: '#/components/requestBodies/UserUpdate'}
      responses:
        '200':
          description: Пользователь успешно изменен
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        default:
          $ref: '#/components/responses/Default'

  /users/{user_id}/consents:
    parameters:
      - $ref: '#/components/parameters/user_id'
    get:
      operationId: ListUserConsents
      summary: Список согласий пользователя
      security: [TalentOAuth: [user:read]]
      tags: [user-consents]
      responses:
        '200': {$ref: '#/components/responses/ListUserConsents'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        default: {$ref: '#/components/responses/Default'}
  /users/{user_id}/consents/{kind}:
    parameters:
      - $ref: '#/components/parameters/user_id'
      - $ref: '#/components/parameters/user_consent_kind'
    head:
      operationId: CheckUserConsent
      summary: Проверка наличия согласия пользователя
      security: [TalentOAuth: [user:read]]
      tags: [user-consents]
      responses:
        '200': {description: Согласие имеется}
        '204': {description: Согласие отсутствует}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        default: {$ref: '#/components/responses/Default'}
    post:
      operationId: SubmitUserConsent
      summary: Фиксация согласия пользователя
      security: [TalentOAuth: [user]]
      tags: [user-consents]
      responses:
        '201': {description: Согласие зафиксировано}
        '204': {description: Согласие уже было дано ранее}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        default: {$ref: '#/components/responses/Default'}

components:
  schemas:
    # Схемы стандартных ответов
    Conflict:
      type: object
      required: [error]
      properties: {error: {type: string}}
    ContentTooLarge:
      type: object
      required: [error]
      properties: {error: {type: string}}
    Error:
      type: object
      required: [error]
      properties: {error: {type: string}}
    NotFound:
      type: object
      required: [error]
      properties: {error: {type: string}}
    PermissionDenied:
      type: object
      required: [error]
      properties: {error: {type: string}}
    Unauthorized:
      type: object
      required: [error]
      properties: {error: {type: string}}
    UnproccessableEntity:
      type: object
      required: [error]
      properties: {error: {type: string}}

    # Схемы объектов в алфавитном порядке.
    ContentLength:
      type: integer
      format: int32
      minimum: 1
      description: Размер файла в байтах.
    EventSignup:
      type: object
      properties:
        consents: {type: array, items: {$ref: '#/components/schemas/UserConsentKind'}}
        email: {type: string, title: Email, format: email}
        last_name: {type: string, title: Фамилия}
        first_name: {type: string, title: Имя}
        middle_name: {type: string, title: Отчество}
        no_middle_name: {type: boolean, title: Нет отчества}
        birthday: {type: string, title: Дата рождения, format: date}
        address: {type: string, title: Адрес}
        sex: {$ref: '#/components/schemas/UserSex'}
        grade: {type: integer, title: Класс, format: int8}
        snils: {type: string, title: СНИЛС}
        adult_confirm: {type: integer, title: Подтверждение родителей, format: int32}
        phone:
          type: string
          title: Номер телефона
          x-ogen-type: "gitlab.jetstyle.in/jetstyle/nti/talent-v2/pkg/auth/phonenumber.PhoneNumber"
        phone_unconfirmed:
          type: string
          title: Номер неподтвержденного телефона
          x-ogen-type: "gitlab.jetstyle.in/jetstyle/nti/talent-v2/pkg/auth/phonenumber.PhoneNumber"
        session_token: {type: string, title: Токен подтверждения телефона}
        stepik_uid: {type: string, title: ID пользователя Stepik}
        github_uid: {type: string, title: ID пользователя GitHub}
        yandex_uid: {type: string, title: ID пользователя Yandex}
        leader_uid: {type: string, title: ID пользователя LeaderID}
        vk_uid: {type: string, title: ID пользователя VK}
        telegram_id: {type: integer, format: int64, title: UID Telegram}
        kaggle_username: {type: string, maxLength: 255, title: Имя пользователя Kaggle аккаунта}
        # team_assignment_fields
        fields:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: integer
    DiplomaTemplate:
      type: string
      enum:
        - diploma
        - cert
      x-enumDescriptions:
        diploma: Шаблон диплома
        cert: Шаблон сертификата
      default: diploma
    DiplomaIssueMode:
      type: string
      description: Для кого предусмотрена выдача дипломов
      enum:
        - all
        - roles
        - none
      x-enumDescriptions:
        all: Выдаются всем
        roles: Выдаются по ролям
        none: Не выдаются никому
      default: none
    EducationalCategory:
      title: Тип образования
      description: Тип образования.
      type: string
      enum:
        - ""
        - high
        - vocational
        - secondary
    EventAchievementsCount:
      type: integer
      format: int32
    EventAchievementRole:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
    EventAchievementsAllowed:
      type: boolean
      description: Допуск на создания достижений на мероприятие.
    EventAltTitle:
      type: string
      description: Альтернативное название мероприятия.
    EventAutocreateMember:
      type: boolean
      description: Автоматическое добавление в участники организации пользователя с подтвержденной заявки.
    EventBrand:
      type: object
      required:
        - id
        - event_id
        - brand_id
      properties:
        id:
          type: integer
          format: int32
        event_id:
          $ref: '#/components/schemas/EventID'
        brand_id:
          type: integer
          format: int32
    EventCanceled:
      type: boolean
      description: Статус отмены мероприятия.
    EventCover:
      type: string
      description: Ссылка на обложку мероприятия.
    EventCoverURLWrite:
      type: string
      format: uri
      description: Ссылка на обложку мероприятия.
    EventCreatedAt:
      type: string
      format: date-time
      description: Дата создания.
    EventCreatedByID:
      type: integer
      format: int32
      nullable: true
      description: ID автора мероприятия.
    EventDeferredNotification:
      title: Отложенное уведомление для участников мероприятия
      type: object
      required:
        - qstatus
        - event_id
        - created_at
        - before_start
        - receivers_cnt
        - started_at
        - finished_at
        - template
        - message
      properties:
        qstatus:
          $ref: '#/components/schemas/QueueStatus'
        event_id:
          $ref: '#/components/schemas/EventID'
        created_at:
          type: string
          format: date-time
          description: Дата создания отложенного уведомления.
        before_start:
          $ref: '#/components/schemas/EventDeferredNotificationBeforeStart'
        receivers_cnt:
          type: integer
          format: int32
          nullable: true
          description: Кол-во отправленных уведомлений.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Дата перевода задачи в статус начатой.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Дата перевода задачи в статус завершенной.
        template:
          $ref: '#/components/schemas/EventDeferredNotificationTemplateID'
        message:
          type: string
          description: Текст отправляемого сообщения.
    EventDeferredNotificationTemplateID:
      type: integer
      format: int16
      description: Идентификатор шаблона отложенного уведомления.
    EventDeferredNotificationBeforeStart:
      type: object
      description: |-
        Интервал до начала мероприятия.
        Вычисляемая дата является границей,
        до которой не отправляются уведомления.
      required:
        - microseconds
        - days
        - months
      properties:
        microseconds:
          type: integer
          format: int64
        days:
          type: integer
          format: int32
        months:
          type: integer
          format: int32
    EventDescription:
      type: string
      description: Описание мероприятия.
    EventDiplomaSettings:
      type: object
      required:
        - event_id
        - diplomas_dark_theme
        - background
        - template
        - diploma_issue_mode
      properties:
        event_id:
          type: integer
          format: int32
          description: ID мероприятия
        diplomas_dark_theme:
          type: boolean
          description: Тёмная тема для дипломов
        background:
          type: string
          format: uri
          description: Фон для дипломов
        template:
          $ref: '#/components/schemas/DiplomaTemplate'
        diploma_issue_mode:
          $ref: '#/components/schemas/DiplomaIssueMode'
    EventDiplomaSettingsWithRoles:
      type: object
      required:
        - event_diploma_settings
      properties:
        event_diploma_settings:
          $ref: '#/components/schemas/EventDiplomaSettings'
        role_ids:
          type: array
          description: |-
            Массив ID ролей, для которых выдаются дипломы.
            Возвращается только если diploma_issue_mode равен roles и только в операциях чтения.
          items:
            type: integer
            format: int32
    EventDraft:
      type: boolean
      description: |-
        Мероприятие находится в статусе черновика.
        На такое мероприятие нельзя зарегистрироваться.
    EventEdge:
      title: Ребро между мероприятиями
      type: object
      required:
