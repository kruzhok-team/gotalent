    get:
      operationId: ArchiveEventRequestsFiles
      summary: Скачивание архива файлов из заявок на мероприятие.
      description: 'Обязательно нужно указать один из параметров: `field_id` или `request_id`.'
      security: [TalentOAuth: [events]]
      tags: [events-manage]
      parameters:
        - {name: field_id, in: query, schema: {type: integer, format: int32}}
        - {name: request_id, in: query, schema: {type: integer, format: int32}}
      responses:
        '200':
          description: Архив для скачивания
          headers:
            Content-Disposition:
              required: true
              schema: {type: string}
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnproccessableEntity'
        default:
          $ref: '#/components/responses/Error'

  /events/{event_id}/signup:
    parameters:
      - $ref: '#/components/parameters/event_id'
    post:
      operationId: EventSignup
      summary: Создание заявки на мероприятие
      description: |-
        #### Аутентификация

        При выполнении запроса с аутентификацией,
        заявка создается для пользователя, с которым связан токен.

        Параметры, используемые для создания пользователя,
        в аутентифицированном запросе будут использованы для его обновления.

        Параметр `email` недопускается в аутентифицированных запросах.
      security: [TalentOAuth: [event-requests], {}]
      tags: [event-requests]
      parameters:
        - {name: dry_run, in: query, schema: {type: boolean},
          description: Валидация запроса без создания заявки}
        - {name: silence_notification, in: query, schema: {type: boolean},
          description: Отключение уведомления пользователя о регистрации}
        - {name: Accept-Language, in: header, schema: {type: string}}
        - {name: utm, in: cookie, schema: {type: string}}
      requestBody: {$ref: '#/components/requestBodies/EventSignup'}
      responses:
        '201':
          description: Заявка успешно создана
          content:
            application/json:
              schema: {type: integer, format: int32}
        '204':
          description: Данные dry_run запроса успешно прошли валидацию
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        default:
          $ref: '#/components/responses/Error'

  /events/{event_id}/teams:
    parameters:
      - $ref: '#/components/parameters/event_id'
    post:
      operationId: CreateEventTeam
      summary: Создание команды
      description: |-
        Администратор организации создает команду на мероприятие.
        В качестве капитана команды и участников указываются пользователи, имеющие заявку на это мероприятие.
      security: [TalentOAuth: [events]]
      tags: [teams-organization]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/OrganizationTeamCreate'}}
      responses:
        '201':
          $ref: '#/components/responses/TeamPrivate'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        default:
          $ref: '#/components/responses/Error'

  /events/{event_id}/teams/{team_id}:
    parameters:
      - $ref: '#/components/parameters/event_id'
      - $ref: '#/components/parameters/team_id'
    get:
      operationId: ReadEventTeam
      summary: Чтение команды с участниками
      description: |-
        Команда на мероприятие для администратора его организации.
        Включает проверку наличия актуального соглашения с организацией.

        ### Причины 4xx ошибок

        | Код | Описание |
        | --- | -------- |
        | <nobr>`403`</nobr> | Пользователь не является администратором организации |
        | <nobr>`404`</nobr> | Мероприятие не найдено |
        | <nobr>`404`</nobr> | Команда не найдена |
      security: [TalentOAuth: [events:read]]
      tags: [teams-organization]
      responses:
        '200':
          $ref: '#/components/responses/TeamPrivateWithPersons'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: UpdateEventTeam
      summary: Обновление команды
      description: |-
        Обновление свойств команды администратором организатора мероприятия.

        ### Причины 4xx ошибок

        | Код | Описание |
        | --- | -------- |
        | <nobr>`403`</nobr> | Пользователь не является администратором организации |
        | <nobr>`404`</nobr> | Мероприятие не найдено |
        | <nobr>`404`</nobr> | Команда не найдена |
        | <nobr>`409`</nobr> | У назначаемого капитаном пользователя уже имеется команда на мероприятии |
        | <nobr>`409`</nobr> | Команда с таким названием уже имеется на мероприятии |
      security: [TalentOAuth: [events]]
      tags: [teams-organization]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/OrganizationTeamUpdate'}}
      responses:
        '200':
          $ref: '#/components/responses/TeamPrivate'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        default:
          $ref: '#/components/responses/Error'

  /events/{event_id}/teams/{team_id}/persons:
    parameters:
      - $ref: '#/components/parameters/event_id'
      - $ref: '#/components/parameters/team_id'
    post:
      operationId: CreateEventTeamPerson
      summary: Добавление участника в команду
      description: |-
        Добавление в команду участника мероприятия администратором организации.

        ### Причины 4xx ошибок

        | Код | Описание |
        | --- | -------- |
        | <nobr>`403`</nobr> | Пользователь не является администратором организации |
        | <nobr>`404`</nobr> | Мероприятие не найдено |
        | <nobr>`404`</nobr> | Команда не найдена |
        | <nobr>`409`</nobr> | У добавляемого пользователя уже имеется команда на мероприятии |
        | <nobr>`422`</nobr> | Невалидный идентификатор пользователя |
      security: [TalentOAuth: [events]]
      tags: [teams-organization]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties: {user_id: {type: integer, format: int32}}
      responses:
        '201':
          $ref: '#/components/responses/TeamPerson'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        default:
          $ref: '#/components/responses/Error'

  /events/{event_id}/teams/{team_id}/persons/{team_person_id}:
    parameters:
      - $ref: '#/components/parameters/event_id'
      - $ref: '#/components/parameters/team_id'
      - $ref: '#/components/parameters/team_person_id'
    patch:
      operationId: UpdateEventTeamPerson
      summary: Обновление участника команды
      description: |-
        Изменение статуса участника команды администратором организации мероприятия.

        ### Причины 4xx ошибок

        | Код | Описание |
        | --- | -------- |
        | <nobr>`403`</nobr> | Пользователь не является администратором организации |
        | <nobr>`404`</nobr> | Мероприятие не найдено |
        | <nobr>`404`</nobr> | Команда не найдена |
        | <nobr>`404`</nobr> | Участник команды не найден |
        | <nobr>`409`</nobr> | У подтверждаемого пользователя уже имеется команда на мероприятии |
      security: [TalentOAuth: [teams]]
      tags: [teams-organization]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationTeamPersonUpdate'}
      responses:
        '200':
          $ref: '#/components/responses/TeamPerson'
        default:
          $ref: '#/components/responses/Error'

  /events/confirm-signup/{event_request_id}/{token}:
    parameters:
      - {name: event_request_id, in: path, required: true, schema: {type: string}}
      - {name: token, in: path, required: true, schema: {type: string}}
    post:
      operationId: ConfirmEventSignup
      summary: Подтверждение заявки на мероприятие
      description: |-
        Для предварительной валидации запроса, без подтверждения заявки,
        нужно указать параметр `dry_run=true`.

        `4xx` ответы:

          * `404` - если не найдена подтверждаемая заявка;
          * `422` - если токен не валиден.
      tags: [event-requests]
      parameters:
        - {name: dry_run, in: query, schema: {type: boolean},
          description: Валидация запроса без подтверждения заявки}
      requestBody:
        required: false
        description: |-
          Тело запроса необходимо указывать при подтверждении заявки с созданием пользователя.

          Об этой необходимости сообщает `202` ответ `dry_run` запроса.
        content:
          application/json:
            schema:
              type: object
              required: [new_password1, new_password2]
              properties:
                new_password1: {type: string}
                new_password2: {type: string}
      responses:
        '200':
          description: Заявка подтверждена
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventSignupConfirmed'}
        '201':
          description: Заявка подтверждена. Создан новый пользователь
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventSignupConfirmed'}
        '202':
          x-summary: Запрос валидный. Необходимо задать пароль для создания пользователя
          description: Возвращается при `dry_run` запросе.
        '204':
          x-summary: Запрос валидный. Найден уже существующий пользователь
          description: Возвращается при `dry_run` запросе.
        '208':
          description: Пользователь уже зарегистрирован на мероприятие
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        default:
          $ref: '#/components/responses/Error'

  /events/diploma-settings:
    get:
      operationId: ListEventDiplomaSettings
      summary: Список настроек дипломов мероприятий
      tags:
        - events-diploma-settings
      security:
        - TalentOAuth: [events:read]
      parameters:
        - $ref: '#/components/parameters/id_offset_32'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - name: event_ids
          in: query
          explode: false
          description: ID мероприятий, записывается в формате `?event_ids=1,2,3`
          schema:
            type: array
            items:
              type: integer
              format: int32
      responses:
        '200':
          description: OK
          headers:
            X-Count:
              $ref: '#/components/headers/X-Count'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventDiplomaSettingsWithRoles'
        default:
          $ref: '#/components/responses/Error'

  /events/requests/{event_request_id}:
    parameters:
      - {name: event_request_id, in: path, required: true, schema: {type: integer, format: int32}}
      - {name: fields, in: query, schema: {type: boolean}}
    get:
      operationId: ReadEventRequest
      summary: Чтение заявки на мероприятие
      security: [TalentOAuth: [event-requests]]
      tags: [event-requests]
      description: Ответ дополняется значениями заполненных в заявке полей при указании параметра `fields=true`.
      responses:
        '200':
          $ref: '#/components/responses/EventRequest'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: UpdateEventRequest
      summary: Обновление заявки на мероприятие
      description: Ответ дополняется значениями заполненных в заявке полей при указании параметра `fields=true`.
      security: [TalentOAuth: [event-requests]]
      tags: [event-requests]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventSignupUpdate'}
      responses:
        '200':
          $ref: '#/components/responses/EventRequest'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        default:
          $ref: '#/components/responses/Error'

  /event-brands:
    get:
      operationId: ListEventBrands
      summary: Список брендированных мероприятий
      tags: [events-read]
      parameters:
        - $ref: '#/components/parameters/event_ids'
