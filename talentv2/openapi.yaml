        application/json:
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items:
              type: string
              format: uuid
              description: Идентификатор файла
    MutationLockPatch:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - active
            properties:
              active:
                type: boolean
    Signup:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Signup'
    UserUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserUpdate'

  responses:
    # Стандартные ответы
    BadRequest:
      description: Невалидный запрос
      content: {application/json: {schema: {type: object, required: [error], properties: {error: {type: string}}}}}
    Conflict:
      description: Конфликт с текущим состоянием
      content: {application/json: {schema: {$ref: '#/components/schemas/Conflict'}}}
    ContentTooLarge:
      description: Содержимое запроса превышает допустимый лимит
      content: {application/json: {schema: {$ref: '#/components/schemas/ContentTooLarge'}}}
    Default:
      description: Ошибка обработки запроса
      headers:
        Www-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: string
    ErrorResponse:
      description: Ошибка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Объект не найден
      content: {application/json: {schema: {$ref: '#/components/schemas/NotFound'}}}
    NotImplemented:
      description: Операция не реализована
      content: {application/json: {schema: {type: object, required: [error], properties: {error: {type: string}}}}}
    PermissionDenied:
      description: Отсутствует доступ на выполнение операции
      content: {application/json: {schema: {$ref: '#/components/schemas/PermissionDenied'}}}
    Unauthorized:
      description: Для выполнения операции требуется пройти авторизацию
      content: {application/json: {schema: {$ref: '#/components/schemas/Unauthorized'}}}
    UnproccessableEntity:
      x-summary: Невозможно выполнить оперцию
      description: |-
        Либо текущее состояние не позволяет выполнить операцию,
        либо передаенные клиентом данные не прошли валидацию,
        хоть их структура и соответствует требуемому формату.
      content:
        application/json: {schema: {$ref: '#/components/schemas/UnproccessableEntity'}}
    ValidationErrors:
      description: |-
        Ошибки валидации запроса

        Каждый ключ - это аспект запроса, которого касается массив ошибок под ключом.
        В большинстве случаев ключи указывают на имя параметра из запроса.
        В некоторых случаях ошибки возвращаются под ключом `non_field_errors`.
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                type: string

    # Ответы OAuth2 провайдера
    IssueTokenSuccess:
      description: Успешно выданный токен
      headers:
        Set-Cookie: {$ref: '#/components/headers/SetCookie'}
      content:
        application/json:
          schema:
            type: object
            required: [access_token, token_type]
            properties:
              access_token: {type: string}
              token_type: {type: string}
              expires_in: {type: integer, format: int32}
              refresh_token: {type: string}
              scope: {type: string}
    IssueTokenError:
      description: Ошибка получения токена
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {type: string}
              error_description: {type: string}
              error_uri: {type: string}

    # Мероприятия
    ListEvents:
      description: OK
      headers:
        X-Count:
          $ref: '#/components/headers/X-Count'
      content:
        application/json:
          schema:
            type: array
            items:
              allOf:
                - $ref: '#/components/schemas/EventMeta'
                - type: object
                  required:
                    - cover
                  properties:
                    cover: {$ref: '#/components/schemas/EventCover'}
    ListAddAchievementEvents:
      description: OK
      headers:
        X-Count:
          $ref: '#/components/headers/X-Count'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AddAchievementEvent'
    ListCalendarEvents:
      description: OK
      headers:
        X-Count:
          $ref: '#/components/headers/X-Count'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CalendarEvent'
    ListOrganizationEvents:
      description: OK
      headers:
        X-Count:
          $ref: '#/components/headers/X-Count'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrganizationEvent'

    # Связанные с мероприятиями обьекты
    EventLimit:
      description: Ограничения мероприятие
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventLimit'
    ListEventBrands:
      description: OK
      headers:
        X-Count:
          $ref: '#/components/headers/X-Count'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EventBrand'
    ListEventRoutes:
      description: OK
      headers:
        X-Count:
          $ref: '#/components/headers/X-Count'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/EventRoute'
    EventDeferredNotification:
      description: Отложенное уведомление
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EventDeferredNotification'
    EventDeferredNotificationLocked:
      description: Отложенное уведомление заблокировано выполнением его отправки
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: string

    # Организации
    ListOrganizations:
      description: OK
      headers:
        X-Count:
          $ref: '#/components/headers/X-Count'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrganizationMeta'
    ListOrganizationSubjects:
      description: OK
      headers:
        X-Count:
          $ref: '#/components/headers/X-Count'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrganizationSubject'

    # Прочее
    ListSubjects:
      description: OK
      headers:
        X-Count:
          $ref: '#/components/headers/X-Count'
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Subject'
    ListUserConsents:
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required: [created_at, kind]
              properties:
                created_at: {type: string, format: date-time}
                kind: {$ref: '#/components/schemas/UserConsentKind'}
    MutationLockPatched:
      description: Состояние блокировки изменено
      content:
        application/json:
          schema:
            type: object
            required:
              - active
            properties:
              active:
                type: boolean
    SocialAuthForbidden:
      description: Авторизация недоступна с указанными параметрами
      content: {text/plain: {schema: {type: string}}}

