openapi: 3.1.0
info:
  title: Talent API v2
  version: '0.11-minor'
  contact:
    email: talent@kruzhok.org
servers:
  - url: https://talent.kruzhok.org/v2
    description: Production Server
  - url: https://talent.test.kruzhok.org/v2
    description: Development Server

tags:
  - name: generic-files
    x-displayName: Файлы любого формата
    description: |-
      Файлы пользователей могут быть как приватными так и публичными.
      Публичные файлы доступны всем, в том числе и без аутентификации.
      Запрос к приватному файлу может осуществляться только от его владельца.
      Так же как и запросы на какое либо изменение файла.

      Файлы могут быть загружены в хранилище и привязаны к объектам любого сервиса.
      Как загрузить файл:
      1. Выполнить запрос на создание файла с указанием пространства имен, где он будет использован. После
      успешного добавления метаинформации о файле в ответе будет получена ссылка на загрузку файла и ID файла.
      2. Загрузить файл в хранилище, используя полученный URL и заголовки.
      3. После успешной загрузки файла сообщить об этом серверу с помощью запроса
      [/files/{file_id}/confirm-upload](#tag/generic-files/operation/FileConfirmUpload) с указанием ID файла.
      4. При необходимости можно повторно получить ссылку на загрузку того же или альтернативного файла, отправив
      запрос на [/files/{file_id}](#tag/generic-files/operation/FileUpload) с указанием его размера.
      5. Для добавления ссылки на объект (ID в пространстве имен), где файл используется, нужно выполнить запрос
      [/files/{file_id}/references/{object_id}](#tag/generic-files/operation/FileReferenceCreate). К одному файлу
      можно добавлять несколько связанных объектов.

      #### Ограничения размера загружаемых файлов

      Допустимый размер одного файла ограничен 10 мегабайтами. При его превышении возвращается 413 ответ.

      Помимо этого, 413 ответ будет возвращен и когда достигается лимит суммы размера файлов пользователя.
  - name: mutation-locks
    x-displayName: Блокировки изменений
    description: |-
      После загрузки, файл может быть заблокирован от изменений.
      Каждая блокировка относится к какому-то объекту в системе,
      для которого файл становится зависимостью.
      Таких объектов-блокировок на файл может быть назначено несколько.
      И пока есть хотя бы одна активная блокировка, файл изменить нельзя.

      Блокировка может быть снята только системой,
      ответственной за объект, на который ссылается блок.
      Для представления этой ссылки, блок имеет два свойства:

        - `object_key` - символьное представление ключа зависимого объекта;
        - `object_namespace` - пространство имен ключа, определяющее тип сущности, которую ключ идентифицирует.
  - name: event-requests
    x-displayName: Заявки на мероприятия
  - name: events-read
    x-displayName: Чтение мероприятий
  - name: events-manage
    x-displayName: Управление мероприятиями
  - name: events-schema
    x-displayName: Схемы для мероприятий
  - name: events-deferred-notification
    x-displayName: Отложенные уведомления
    description: Отложенные уведомления для участников мероприятий.
  - name: events-diploma-settings
    x-displayName: Настройки дипломов для мероприятий
  - name: oauth
    x-displayName: OAuth2 провайдер
    description: |-
      Реализация авторизационного сервера OAuth2.
      [RFC6749](https://tools.ietf.org/html/rfc6749)
      [RFC7636](https://tools.ietf.org/html/rfc7636)
  - name: organizations
    x-displayName: Операции организаций
  - name: organization-subjects
    x-displayName: Операции с тематиками организаций
  - name: persons
    x-displayName: Персоны пользователей
  - name: user-signup
    x-displayName: Регистрация пользователя
  - name: user-profile
    x-displayName: Профиль пользователя
  - name: social-auths
    x-displayName: Внешние провайдеры авторизации
  - name: teams
    x-displayName: Команды пользователей
  - name: teams-schema
    x-displayName: Схемы для команд
  - name: user-consents
    x-displayName: Пользовательские согласия
    description: |-
      Параметр `user_id` в запросе должен содержать идентификатор аутентифицированного пользователя.
  - name: auth
    x-displayName: Аутентификация
    description: |-
      ## TalentOAuth

      Аутентификация токеном TalentOAuth пользователем Таланта.
      Передается в заголовке `Authorization: Bearer` в формате JWT.

      При использовании этой аутентификации,
      авторизация сервисом выполняется в отношении пользователя,
      авторизовавшего переданный токен.

      Для получения токена нужно воспользоваться [API OAuth2 провайдера](#tag/oauth).

      ## ClientCredentials

      Аутентификация учетными данными OAuth2 клиента TalentOAuth.
      В качестве `username` используется `client_id`, а в `password` - `client_secret`.
  - name: offset
    x-displayName: Пагинация
    description: |-
      Пагинация может быть представлена как параметром `offset`, так и параметром `id_offset`.
      Параметр `offset` позволяет указать кол-во объектов для пропуска из читаемой выборки.
      В `id_offset` указывается идентификатор, до которого включительно будут пропущены объекты.

      > Предпочтительно, когда есть возможность, использовать `id_offset`.
      > Также надо учитывать, что допустимое значение для `offset` имеет ограничения.

      > У `id_offset` тоже имеется ограничение - с ним не доступны варианты сортировки результатов,
      > за исключением вариантов `id_asc` и `id_desc`.
      > Для иных значений `order_by` будет возвращаться ответ `400 Bad Request`.
    x-traitTag: true

x-tagGroups:
  - name: Общие свойства API
    tags:
      - auth
      - offset
  - name: Авторизация
    tags:
      - oauth
  - name: Мероприятия
    tags:
      - events-schema
      - events-read
      - events-manage
      - events-deferred-notification
      - events-diploma-settings
      - event-requests
  - name: Организации
    tags:
      - organizations
      - organization-subjects
  - name: Пользователи
    tags:
      - persons
      - social-auths
      - user-signup
      - user-profile
      - user-consents
  - name: Команды
    tags:
      - teams
      - teams-schema
  - name: Файлы
    tags:
      - generic-files
      - mutation-locks

paths:
  /auth/login/{provider}:
    parameters:
      - $ref: '#/components/parameters/social_auth_provider'
      - name: next
        in: query
        schema:
          type: string
          description: Адрес перенаправления после завершения авторизации
      - name: reg_next
        in: query
        schema:
          type: string
          description: Адрес перенаправления для заполнения формы регистрации
      - name: err_next
        in: query
        schema:
          type: string
          description: Адрес перенаправления при завершении авторизации ошибкой
    get:
      operationId: LoginSocialAuth
      summary: Авторизация во внешнем провайдере
      tags: [social-auths]
      responses:
        '200':
          description: Провайдер не имеет страницы подтверждения
          content:
            text/plain:
              schema: {type: string, description: Значение параметра state}
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetCookie'}
        '302':
          description: Перенаправление на страницу подтверждения авторизации
          headers:
            Location: {required: true, schema: {type: string}}
            Set-Cookie: {$ref: '#/components/headers/SetCookie'}
        '403':
          $ref: '#/components/responses/SocialAuthForbidden'
        default:
          $ref: '#/components/responses/Default'

  /auth/complete/{provider}:
    parameters:
      - $ref: '#/components/parameters/social_auth_provider'
      - name: state
        in: query
        required: true
        schema: {type: string}
      - name: csrf_state
        in: cookie
        schema: {type: string}
    get:
      operationId: CompleteSocialAuth
      summary: Завершение авторизации
      tags: [social-auths]
      responses:
        '302':
          description: Дальнейшее перенаправление
          headers:
            Location:
              {required: true, schema: {type: string}}
            Set-Cookie: {$ref: '#/components/headers/SetCookie'}
        '403':
          $ref: '#/components/responses/SocialAuthForbidden'
        default:
          $ref: '#/components/responses/Default'

  /auth/disconnect/{provider}/{uid}:
    parameters:
      - $ref: '#/components/parameters/social_auth_provider'
      - name: uid
        in: path
        required: true
        description: Внешний идентификатор пользователя
        schema: {type: string}
    post:
      operationId: DisconnectSocialAuth
      summary: Удаление авторизации
      description: |-
        Удаление авторизации возможно только если это не единственный оставшийся у пользователя способ аутентификации под своей учетной записью.

        Не допускается параллельная обработка запросов на удаление, в случае появления такой гонки, будет возвращен 409 ответ.
      security: [TalentOAuth: [user]]
      tags: [social-auths]
      responses:
        '204':
          description: Данные об авторизации успешно удалены
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Default'

  /auth/signup:
    get:
      operationId: SignupInitialData
      summary: Данные для предзаполнения формы регистрации
      tags: [user-signup]
      parameters:
        - {name: partial_token, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Данные найдены
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  oneOf:
                    - type: string
                    - type: boolean
        '204':
          description: Данные отсутствуют
        default:
          $ref: '#/components/responses/Default'
    post:
      operationId: Signup
      summary: Регистрация пользователя
      tags: [user-signup]
      parameters:
        - {name: partial_token, in: query, schema: {type: string, format: uuid}}
        - {name: utm, in: cookie, schema: {type: string}}
      requestBody: {$ref: '#/components/requestBodies/Signup'}
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetCookie'}
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int32
                  expires_in:
                    type: integer
                    format: int32
                  reg_token:
                    type: string
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        '501':
          $ref: '#/components/responses/NotImplemented'
        default:
          $ref: '#/components/responses/Default'

  /auth/confirm-email/{uid}/{token}:
    parameters:
      - {name: uid, in: path, required: true, schema: {type: string}}
      - {name: token, in: path, required: true, schema: {type: string}}
    post:
      operationId: ConfirmSignupEmail
      summary: Завершение регистрации пользователя подтверждением почты
      tags: [user-signup]
      responses:
        '201':
          description: Пользователь успешно зарегистрирован
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetCookie'}
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        '501':
          $ref: '#/components/responses/NotImplemented'
        default:
          $ref: '#/components/responses/Default'

  /files:
    get:
      operationId: ListFileMeta
      summary: Список файлов
      description: |-
        #### Неаутентифицированный запрос публичных файлов

        Допускается запрос без аутентификации при соблюдении условий:
          - присутствуют значения параметра `file_id`
          - параметр `is_public` отсутствует либо содержит `true`

        При несоблюдении какого-либо из условий, возвращается `401` ответ.
      tags:
        - generic-files
      security:
        - TalentOAuth: [files:read]
        - {}
      parameters:
        - name: file_id
          in: query
          description: Чтение метаинформации конкретных файлов. Значения указываются через запятую.
          explode: false
          schema:
            type: array
            maxItems: 30
            items:
              type: string
              format: uuid
        - name: is_public
          in: query
          description: Статус публичности файла.
          schema:
            type: boolean
        - name: namespace
          in: query
          description: |-
            Пространство имен для объекта, где используется файл, в формате
            <сервис>/<таблица БД>/<поле со ссылкой на файл>
            (например, polls/questions/picture, venues/venue/cover, etc.)
          schema:
            type: string
        - name: namespace_startswith
          in: query
          description: Фильтрация по префиксной подстроке в пространстве имен.
          schema:
            type: string
            minLength: 3
        - name: name_like
          in: query
          description: Фильтрация по подстроке в имени файла.
          schema:
            type: string
            minLength: 3
        - name: ext
          in: query
          description: Фильтрация по точному совпадению расширения.
          schema:
            type: string
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - name: order_by
          in: query
          description: Поле, по которому будет отсортирован список файлов.
          schema:
            type: string
            default: created_at_desc
            enum:
              - created_at_asc
              - created_at_desc
              - uploaded_at_asc
              - uploaded_at_desc
              - file_id
      responses:
        '200':
          description: OK
          headers:
            X-Count:
              $ref: '#/components/headers/X-Count'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/Default'
    post:
      operationId: CreateFileMeta
      summary: Создание файла
      tags:
        - generic-files
      security:
        - TalentOAuth: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - namespace
                - content_type
                - content_length
              properties:
                namespace:
                  type: string
                  description: |-
                    Пространство имен для объекта, где используется файл, в формате
                    <сервис>/<таблица БД>/<поле со ссылкой на файл>
                    (например, polls/questions/picture, venues/venue/cover, etc.)
                is_public:
                  type: boolean
                  description: Статус публичности файла.
                  default: false
                extension:
                  type: string
                  pattern: '^\.[a-zA-Z0-9]+$'
                  minLength: 2
                  maxLength: 10
                  description: Расширение файла (например, .jpg, .png, .pdf, etc.)
                content_type:
                  type: string
                  description: MIME-тип файла.
                content_length:
                  $ref: '#/components/schemas/ContentLength'
                name:
                  $ref: '#/components/schemas/FileMetaName'
      responses:
        '201':
          description: Метаданные файла добавлены, ссылка на загрузку сформирована.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FileMeta'
                  - $ref: '#/components/schemas/FilePresignedRequest'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '422':
          $ref: '#/components/responses/UnproccessableEntity'
        default:
          $ref: '#/components/responses/Default'
  /files/{file_id}:
    get:
      operationId: ReadFile
      summary: Получение ссылки на файл
      description: |-
        По-умолчанию возвращается в форме `307` ответа.
        С параметром `noredir=true` возвращается `200`.

        Чтение приватного файла требует прохождение авторизации.
        Аутентифицированный пользователь должен быть владельцем файла.
      tags:
        - generic-files
      security:
        - TalentOAuth: [files:read] # Непонятно нужен ли скоуп
        - {}
      parameters:
        - name: noredir
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Ссылка на файл
          content:
            application/json:
              schema:
                type: string
                format: uri
        '307':
          description: Перенаправление на файл в хранилище
          headers:
            Location:
              required: true
              description: URL файла в хранилище
              schema:
                type: string
                format: uri
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'
    put:
      operationId: UploadFile
      summary: Создание запроса на загрузку файла
      description: |-
        Позволяет повторно получить ссылку на загрузку того же файла или сформировать
        ссылку для загрузки новой версии файла (того же типа, но другого размера).
      tags:
        - generic-files
      security:
        - TalentOAuth: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content_length
              properties:
                content_length:
                  $ref: '#/components/schemas/ContentLength'
      responses:
        '200':
          description: Предподписанный запрос на загрузку файла
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePresignedRequest'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '422':
          description: Файл заблокирован и недоступен для изменения
        default:
          $ref: '#/components/responses/Default'
    parameters:
      - name: file_id
        in: path
        required: true
        description: ID файла
        schema:
          type: string
          format: uuid
  /files/{file_id}/meta:
    get:
      operationId: ReadFileMeta
      summary: Чтение информации о файле
      description: |-
        Чтение приватного файла требует прохождение авторизации.
        Аутентифицированный пользователь должен быть владельцем файла.
      tags:
        - generic-files
      security:
        - TalentOAuth: [files:read] # Непонятно нужен ли скоуп
        - {}
      responses:
        '200':
          description: Информация о файле
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'
    patch:
      operationId: UpdateFileMeta
      summary: Обновление информации о файле
      tags:
        - generic-files
      security:
        - TalentOAuth: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: '#/components/schemas/FileMetaName'
      responses:
        '200':
          description: Файл обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMeta'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'
    parameters:
      - name: file_id
        in: path
        required: true
        description: ID файла.
        schema:
          type: string
          format: uuid
  /files/{file_id}/confirm-upload:
    post:
      operationId: ConfirmFileUpload
      summary: Подтверждение загрузки файла
      tags:
        - generic-files
      security:
        - TalentOAuth: [files]
      responses:
        '200':
          description: Файл отмечен загруженным, счетчик версий обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileMeta'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Default'
    parameters:
      - name: file_id
        in: path
        required: true
        description: ID файла.
        schema:
          type: string
          format: uuid
  /files/{file_id}/references/{object_id}:
    put:
      operationId: CreateFileReference
      summary: Добавление ссылки на файл
      tags:
        - generic-files
      security:
        - TalentOAuth: [files]
      responses:
        '200':
          description: Ссылка на файл добавлена
          content:
            application/json:
              schema:
