        default:
          $ref: '#/components/responses/Error'

  /events/{event_id}:
    parameters:
      - $ref: '#/components/parameters/event_id'
    get:
      operationId: ReadEvent
      summary: Чтение свойств мероприятия
      tags: [events-read]
      description: |-
        По умолчанию возвращаются только метаданные.
        Для получения полного набора свойств используйте параметр `extend`.

        ### Причины 4xx ошибок

        | Код | Описание |
        | --- | -------- |
        | <nobr>`404`</nobr> | Мероприятие не найдено |
      parameters:
        - name: extend
          in: query
          description: Вернуть в ответе полный набор свойств.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/EventMeta'
                  - $ref: '#/components/schemas/Event'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: UpdateEvent
      summary: Обновление свойств мероприятия
      security: [TalentOAuth: [events]]
      tags: [events-manage]
      requestBody: {$ref: '#/components/requestBodies/EventUpdate'}
      responses:
        '200':
          $ref: '#/components/responses/Event'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        default:
          $ref: '#/components/responses/Error'

  /events/{event_id}/deferred-notification:
    parameters:
      - $ref: '#/components/parameters/event_id'
    head:
      operationId: ExistsEventDeferredNotification
      summary: Проверка наличия отложенного уведомления
      tags: [events-deferred-notification]
      responses:
        '200':
          description: Уведомление существует
        '204':
          description: Уведомление отсутствует
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: ReadEventDeferredNotification
      summary: Чтение отложенного уведомления
      tags: [events-deferred-notification]
      security:
        - TalentOAuth: [events:read]
      responses:
        '200':
          $ref: '#/components/responses/EventDeferredNotification'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: CreateEventDeferredNotification
      summary: Создание отложенного уведомления
      tags: [events-deferred-notification]
      security:
        - TalentOAuth: [events]
      requestBody:
        $ref: '#/components/requestBodies/EventDeferredNotificationCreate'
      responses:
        '201':
          $ref: '#/components/responses/EventDeferredNotification'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: UpdateEventDeferredNotification
      summary: Изменение отложенного уведомления
      description: |-
        Если уведомление уже существует и оно находится в статусе `canceled`,
        оно будет переведено в статус `pending`.
      tags: [events-deferred-notification]
      security:
        - TalentOAuth: [events]
      requestBody:
        $ref: '#/components/requestBodies/EventDeferredNotificationUpdate'
      responses:
        '200':
          $ref: '#/components/responses/EventDeferredNotification'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EventDeferredNotificationLocked'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: CancelEventDeferredNotification
      summary: Отмена запланированного уведомления
      description: |-
        Перевод уведомления из статуса `pending` в статус `canceled`.

        Если уведомление в статусе `pending` не найдено, будет возвращен `404` ответ.
      tags: [events-deferred-notification]
      security:
        - TalentOAuth: [events]
      responses:
        '200':
          $ref: '#/components/responses/EventDeferredNotification'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EventDeferredNotificationLocked'
        default:
          $ref: '#/components/responses/Error'

  /events/{event_id}/diploma-role/{role_id}:
