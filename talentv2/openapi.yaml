      summary: Идентификатор шаблона отложенного уведомления
      tags: [events-deferred-notification]
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDeferredNotificationTemplateID'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /event-routes:
    get:
      operationId: ListEventRoutes
      summary: Список направлений мероприятий
      tags: [events-read]
      parameters:
        - $ref: '#/components/parameters/event_ids'
        - $ref: '#/components/parameters/route_ids'
        - $ref: '#/components/parameters/id_offset_32'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          headers:
            X-Count: {$ref: '#/components/headers/X-Count'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/EventRoute'}}
        default:
          $ref: '#/components/responses/Error'

  /geo/{geodata_id}:
    parameters:
      - {name: geodata_id, in: path, required: true, schema: {type: integer, format: int32}}
    get:
      operationId: ReadGeoData
      summary: Чтение геоданных по идентификатору
      description: |-
        Все свойства, кроме отмеченных как `nullable`,
        могут содержать пустые строки в значениях.
      tags: [geodata]
      responses:
        '200':
          description: Ok
          content:
            application/json: {schema: {$ref: '#/components/schemas/GeoData'}}
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /geo/fias/city/{fias}:
    parameters:
      - {name: fias, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: CityName
      summary: Название города по ФИАС ID
      tags: [geodata]
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                required: [name, region_fias]
                properties:
                  name: {type: string}
                  region_fias: {type: string, format: uuid}
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /geo/fias/region/{fias}:
    parameters:
      - {name: fias, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: RegionName
      summary: Название региона по ФИАС ID
      tags: [geodata]
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties: {name: {type: string}}
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /geo/suggest/{field}:
    get:
      operationId: SuggestGeoField
      summary: Подсказки по геоданным
      tags: [geodata]
      parameters:
        - {name: field, in: path, required: true, schema: {
          type: string, enum: [region_with_type, city]}}
        - {name: term, in: query, required: true, schema: {
          type: string, minLength: 3}}
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema: {type: array, items: {type: object, required: [name], properties: {
                name: {type: string},
                fias: {type: string, format: uuid}}}}
        default:
          $ref: '#/components/responses/Error'

  /mutation-locks/{object_namespace}/{object_key}:
    parameters:
      - $ref: '#/components/parameters/mutation_lock_object_namespace'
      - $ref: '#/components/parameters/mutation_lock_object_key'
    post:
      operationId: CreateMutationLock
      summary: Блокировка файлов от изменений
      description: |-
        Блокировки создаются только для файлов, принадлежащих пользователю.
        Чужие файлы, несуществующие файлы, а так же файлы,
        для которых блокировки уже имеются,
        будут пропущены и не возвращены в теле `201` ответа.
      tags: [mutation-locks]
      security:
        - TalentOAuth: [files]
      requestBody: {$ref: '#/components/requestBodies/MutationLockCreate'}
      responses:
        '201':
          description: Идентификаторы файлов, для которых были созданы блокировки.
          content: {application/json: {schema: {$ref: '#/components/schemas/UUIDs'}}}
        '204':
          description: Ни один файл не был заблокирован.
        '409':
          description: Конфликтный запрос создания блокировки.
        '422':
          description: Указан невалидный object_namespace.
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: PatchMutationLock
      summary: Изменение состояния блокировки
      description: |-
        Изначально блокировка создается в состоянии активной.
        После создания, состояние можно декактивировать и активировать обратно.

        > Неактивная блокировка равнозначна ее отсутствию.
      tags: [mutation-locks]
      security:
        - ClientCredentials: []
      requestBody: {$ref: '#/components/requestBodies/MutationLockPatch'}
      responses:
        '200':
          $ref: '#/components/responses/MutationLockPatched'
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: DeleteMutationLock
      summary: Удаление блокировки
      tags: [mutation-locks]
      security:
        - ClientCredentials: []
      responses:
        '204':
          description: Блокировка удалена
        '403':
          $ref: '#/components/responses/PermissionDenied'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Error'

  /oauth/authorize:
    get:
      # TODO: Cache-Control: no-store, no-cache, must-revalidate; Pragma: no-cache; Expires: 0
      operationId: ValidateAuthorization
      summary: Валидация авторизационных параметров
      security: [TalentOAuth: []]
      tags: [oauth]
      parameters:
        - {name: response_type, in: query, required: true, schema: {type: string}}
        - {name: redirect_uri, in: query, required: true, schema: {type: string}}
        - {name: client_id, in: query, required: true, schema: {type: string}}
        - {name: scope, in: query, schema: {type: string}}
        - {name: auto_renew, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Ok
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: AuthorizeClient
      summary: Авторизация клиента
      description: Пользователь авторизует доступ клиента к ресурсам пользователя
      security: [TalentOAuth: []]
      tags: [oauth]
      responses:
        '302':
          description: Ok
          headers:
            Location: {required: true, schema: {type: string}}
        default:
          $ref: '#/components/responses/Error'

  /oauth/issue-token:
    post:
      operationId: IssueAccessToken
      summary: Выдача токена доступа
      tags: [oauth]
      responses:
        '200': {$ref: '#/components/responses/IssueTokenSuccess'}
        '400': {$ref: '#/components/responses/IssueTokenError'}
        default:
          $ref: '#/components/responses/Error'

  /organization-subjects:
    get:
      operationId: ListOrganizationSubjects
      summary: Список связей организаций и тематик
      tags: [organization-subjects]
      parameters:
        - $ref: '#/components/parameters/id_offset_32'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/organization_ids'
        - $ref: '#/components/parameters/subject_ids'
      responses:
        '200':
          $ref: '#/components/responses/ListOrganizationSubjects'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: CreateOrganizationSubject
      summary: Добавление тематики для организации
      description: |-
        > Запрос необходимо выполнять от ментора или владельца организации,
        > указываемой в свойстве `organization_id` тела запроса.
      security: [TalentOAuth: [events]]
      tags: [organization-subjects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationSubjectBody'
      responses:
        '201':
          description: Тематика добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSubject'
        '403':
          description: Пользователь не имеет административных прав в организаци
        '409':
          description: Тематика уже добавлена в организацию
        default:
          $ref: '#/components/responses/Error'

  /organizations:
    get:
      operationId: ListOrganizations
      summary: Список организаций
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/organization_ids'
        - $ref: '#/components/parameters/parent_organization_id'
        - $ref: '#/components/parameters/id_offset_32'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
        - name: order_by
          in: query
          description: Критерий сортировки результатов.
          schema:
            type: string
            default: 'id_asc'
            enum:
              - id_asc
              - id_desc
      responses:
        '200':
          $ref: '#/components/responses/ListOrganizations'
        '422':
          $ref: '#/components/responses/UnproccessableEntity'
        default:
          $ref: '#/components/responses/Error'

  /organizations/{organization_id}/is-admin:
    post:
      operationId: IsOrganizationAdmin
      summary: Проверка наличия административных прав в организации
      security: [TalentOAuth: []]
      tags: [organizations]
      parameters:
        - $ref: '#/components/parameters/organization_id'
        - name: is_owner
          in: query
          description: |-
            Требование наличия или отсутствия статуса владельца организации.

            При указании значения, роль пользователя должна ему соответствовать;
            это значит что если указать `false`, а пользователь является владельцем,
            то ответ будет иметь статус `403`.
          schema:
            type: boolean
      responses:
        '200':
          description: Права администратора имеются
        '403':
          description: Права отсутствуют
        '404':
          description: Организация не найдена
        default:
          $ref: '#/components/responses/Error'

  /persons/{person_id}:
    parameters:
      - name: person_id
        in: path
        required: true
        description: ID персоны.
        schema: {type: integer, format: int32}
    get:
      operationId: ReadPerson
      summary: Чтение персоны
      description: |-
        Чтение персоны, опционально ассоциированной с пользователем.

        ### Причины 4xx ошибок

        | Код | Описание |
        | --- | -------- |
        | <nobr>`404`</nobr> | Персона не найдена |
      tags: [persons]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user_id]
                properties:
                  user_id:
                    type: integer
                    format: int32
                    nullable: true
                    description: TalentID пользователя, которому принадлежит персона.
        default:
          $ref: '#/components/responses/Error'

  /social-auths/{talent_id}:
    parameters:
      - $ref: '#/components/parameters/talent_id'
    get:
      operationId: ListSocialAuths
      summary: Список авторизаций пользователя в соц. сетях
      security:
        - TalentOAuth: [user:read]
        - ClientCredentials: []
      tags: [social-auths]
      parameters:
        - name: provider
          in: query
          required: false
          description: Фильтрация по провайдеру авторизации
          schema: {$ref: '#/components/schemas/SocialAuthProvider'}
        - $ref: '#/components/parameters/id_offset_32'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Ok
          headers:
            X-Count: {$ref: '#/components/headers/X-Count'}
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SocialAuth'}}
        '403':
          $ref: '#/components/responses/PermissionDenied'
        default:
          $ref: '#/components/responses/Error'

  /subjects:
    get:
      operationId: ListSubjects
      summary: Список тематик для организаций
      tags: [organization-subjects]
      parameters:
        - $ref: '#/components/parameters/id_offset_32'
        - $ref: '#/components/parameters/offset'
        - $ref: '#/components/parameters/limit'
      responses:
        '200': {$ref: '#/components/responses/ListSubjects'}
        default: {$ref: '#/components/responses/Error'}

  /teams:
    get:
      operationId: ListTeams
      summary: Список команд
      description: Все команды пользователей.
      security: [TalentOAuth: []]
      tags: [teams]
      parameters:
        - $ref: '#/components/parameters/id_offset_32'
        - $ref: '#/components/parameters/limit'
        - name: id
          in: query
          explode: false
          description: Фильтрация по массиву идентификаторов команд.
          schema: {type: array, minItems: 1, maxItems: 100, items: {type: integer, format: int32}}
        - name: order_by
          in: query
          description: Критерий сортировки результатов.
          schema: {type: string, default: 'id_asc', enum: [id_asc, id_desc]}
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/TeamPublic'}}
        default:
          $ref: '#/components/responses/Error'

  /teams/{team_id}:
    parameters:
      - {$ref: '#/components/parameters/team_id'}
    get:
      operationId: ReadTeam
      summary: Чтение команды
      description: |-
        Свойства команды, опционально содержащие список ее участников.

        ### Причины 4xx ошибок

        | Код | Описание |
        | --- | -------- |
        | <nobr>`404`</nobr> | Команда не найдена |
      security: [TalentOAuth: [], {}]
      tags: [teams]
      parameters:
        - {name: persons, in: query, schema: {type: boolean},
           description: Включить в ответ массив участников команды}
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamPublicWithPersons'}
        default:
          $ref: '#/components/responses/Error'

  /teams/contact-validate:
    post:
      operationId: ValidateTeamContact
      summary: Валидация контактной ссылки
      tags: [teams]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeamContactLink'}
      responses:
        '200':
          description: Ссылка корректна для использования в качестве контактной ссылки команды
          x-summary: Ссылка прошла валидацию
        '422':
          description: Ссылка не прошла валидацию
        default:
          $ref: '#/components/responses/Error'

  /users/me/teams:
    post:
      operationId: CreateUserTeam
      summary: Создание команды
      description: |-
        Создание команды от аутентифицированного пользователя.
        Пользователь становится и ее капитаном и ее первым участником.

        ### Причины 4xx ошибок

        | Код | Описание |
        | --- | -------- |
        | <nobr>`403`</nobr> | Мероприятие завершено |
        | <nobr>`404`</nobr> | Команда не найдена |
        | <nobr>`409`</nobr> | У пользователя уже имеется команда на мероприятии |
        | <nobr>`409`</nobr> | Команда с таким названием уже имеется на мероприятии |
        | <nobr>`422`</nobr> | Невалидный идентификатор мероприятия |
        | <nobr>`422`</nobr> | Невалидная контактная ссылка |
        | <nobr>`422`</nobr> | Невалидное название команды |
        | <nobr>`422`</nobr> | Мероприятие не допускает командного участия |
        | <nobr>`422`</nobr> | Мероприятие не допускает управления параметром `assignment_participation` |
        | <nobr>`422`</nobr> | Название команды уже занято на мероприятии |
      security: [TalentOAuth: [teams]]
      tags: [teams-user]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/OwnerTeamCreate'}}
      responses:
        '201':
          $ref: '#/components/responses/TeamPrivate'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        default:
          $ref: '#/components/responses/Error'

  /users/me/teams/{team_id}:
    parameters:
      - $ref: '#/components/parameters/team_id'
    get:
      operationId: ReadUserTeam
      summary: Чтение команды
      description: |-
        Чтение команды ее участником или капитаном.

        ### Причины 4xx ошибок

        | Код | Описание |
        | --- | -------- |
        | <nobr>`403`</nobr> | Пользователь не является ни участником, ни капитаном команды |
        | <nobr>`404`</nobr> | Команда не найдена |
      security: [TalentOAuth: [teams:read]]
      tags: [teams-user]
      responses:
        '200':
          $ref: '#/components/responses/TeamPrivateWithPersons'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: UpdateUserTeam
      summary: Обновление команды
      description: |-
        Обновление свойств команды ее капитаном.

        ### Причины 4xx ошибок

        Таблица не включает в себя ошибки валидации возвращаемые с 422 статусом.

        | Код | Описание |
        | --- | -------- |
        | <nobr>`403`</nobr> | Пользователь не является капитаном команды |
        | <nobr>`403`</nobr> | Мероприятие завершено |
        | <nobr>`404`</nobr> | Команда не найдена |
        | <nobr>`409`</nobr> | У пользователя уже имеется команда на мероприятии |
        | <nobr>`409`</nobr> | Команда с таким названием уже имеется на мероприятии |
      security: [TalentOAuth: [teams]]
      tags: [teams-user]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/OwnerTeamUpdate'}}
      responses:
        '200':
          $ref: '#/components/responses/TeamPrivate'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        default:
          $ref: '#/components/responses/Error'

  /users/me/teams/{team_id}/is-owner:
    parameters:
      - $ref: '#/components/parameters/team_id'
    post:
      operationId: IsTeamOwner
      summary: Статус капитана в команде
      description: |-
        Является ли пользователь капитаном указанной команды.

        ### Причины 4xx ошибок

        | Код | Описание |
        | --- | -------- |
        | <nobr>`403`</nobr> | Пользователь не является капитаном команды |
        | <nobr>`404`</nobr> | Команда не найдена |
      security: [TalentOAuth: [teams:read]]
      tags: [teams-user]
      responses:
        '200':
          description: Пользователь является капитаном команды
        default:
          $ref: '#/components/responses/Error'

  /users/me/teams/{team_id}/persons:
    parameters:
      - $ref: '#/components/parameters/team_id'
    post:
      operationId: CreateUserTeamPerson
      summary: Добавление участника в команду
      description: |-
        Добавление в команду нового участника ее капитаном или запрос на добавление от участника.

        Запрос от участника, при наличии в нем (корректного) `invite_code`,
        не требует подтверждения со стороны капитана команды.

        Если участник уже добавлен в команду, возвращется `200` ответ.
        В том числе и когда он находится в частично отклоненном состоянии:

          - на запрос от капитана, может вернуться участник, отклонивший свое участие
          - на запрос от самого участника, может вернуться уже имеющаяся заявка на участие, отклоненная капитаном.

        ### Причины 4xx ошибок

        | Код   | Описание |
        | ----- | -------- |
        | <nobr>`403`</nobr> | Пользователь не является капитаном команды |
        | <nobr>`403`</nobr> | Мероприятие команды завершено |
        | <nobr>`404`</nobr> | Команда не найдена |
        | <nobr>`409`</nobr> | У добавляемого пользователя уже имеется команда на мероприятии |
        | <nobr>`422`</nobr> | Указан невалидный ID пользователя |
        | <nobr>`422`</nobr> | Указан неправильный инвайт-код |
        | <nobr>`422`</nobr> | У добавляемого пользователя отсутствует заявка на мероприятие команды |
        | <nobr>`422`</nobr> | Достижение допустимого количества участников команды |
        | <nobr>`422`</nobr> | Достижение допустимого количества приглашений в команду |
        | <nobr>`422`</nobr> | Достижение допустимого количества запросов в команды для пользователя |
      security: [TalentOAuth: [teams]]
      tags: [teams-user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/OwnerTeamPersonCreate'
                - $ref: '#/components/schemas/UserTeamPersonCreate'
      responses:
        '200':
          $ref: '#/components/responses/TeamPerson'
        '201':
          $ref: '#/components/responses/TeamPerson'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        default:
          $ref: '#/components/responses/Error'

  /users/me/teams/{team_id}/persons/me:
    parameters:
      - $ref: '#/components/parameters/team_id'
    patch:
      operationId: UpdateUserTeamPerson
      summary: Обновление своего участия в команде
      description: |-
        Изменение статуса участия в команде от ее участника.

        ### Причины 4xx ошибок

        | Код   | Описание |
        | ----- | -------- |
        | <nobr>`403`</nobr> | Мероприятие команды завершено |
        | <nobr>`404`</nobr> | Команда не найдена |
        | <nobr>`404`</nobr> | Пользователь не является участником команды |
        | <nobr>`409`</nobr> | У пользователя уже имеется команда на мероприятии |
        | <nobr>`422`</nobr> | У пользователя отсутствует заявка на мероприятие команды |
        | <nobr>`422`</nobr> | Достижение допустимого количества участников команды |
        | <nobr>`422`</nobr> | Достижение допустимого количества запросов в команды для пользователя |
      security: [TalentOAuth: [teams]]
      tags: [teams-user]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserTeamPersonUpdate'}
      responses:
        '200':
          $ref: '#/components/responses/TeamPerson'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        default:
          $ref: '#/components/responses/Error'

  /users/me/teams/{team_id}/persons/{team_person_id}:
    parameters:
      - $ref: '#/components/parameters/team_id'
      - $ref: '#/components/parameters/team_person_id'
    patch:
      operationId: UpdateOwnerTeamPerson
      summary: Обновление участника команды
      description: |-
        Изменение статуса участника команды ее капитаном.

        ### Причины 4xx ошибок

        | Код   | Описание |
        | ----- | -------- |
        | <nobr>`403`</nobr> | Пользователь не является капитаном команды |
        | <nobr>`403`</nobr> | Мероприятие команды завершено |
        | <nobr>`404`</nobr> | Команда не найдена |
        | <nobr>`404`</nobr> | Не найден участник команды |
        | <nobr>`409`</nobr> | У пользователя уже имеется команда на мероприятии |
        | <nobr>`422`</nobr> | У пользователя отсутствует заявка на мероприятие команды |
        | <nobr>`422`</nobr> | Достижение допустимого количества участников команды |
        | <nobr>`422`</nobr> | Достижение допустимого количества приглашений в команду |
      security: [TalentOAuth: [teams]]
      tags: [teams-user]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OwnerTeamPersonUpdate'}
      responses:
        '200':
          $ref: '#/components/responses/TeamPerson'
        '422':
          $ref: '#/components/responses/ValidationErrors'
        default:
          $ref: '#/components/responses/Error'

  /users/{talent_id}/consents:
    parameters:
      - $ref: '#/components/parameters/talent_id'
    get:
      operationId: ListUserConsents
      summary: Список согласий пользователя
      security: [TalentOAuth: [user:read]]
      tags: [user-consents]
      responses:
        '200': {$ref: '#/components/responses/ListUserConsents'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        default: {$ref: '#/components/responses/Error'}

  /users/{talent_id}/consents/{kind}:
    parameters:
      - $ref: '#/components/parameters/talent_id'
      - $ref: '#/components/parameters/user_consent_kind'
    head:
      operationId: CheckUserConsent
      summary: Проверка наличия согласия пользователя
      security: [TalentOAuth: [user:read]]
      tags: [user-consents]
      responses:
        '200': {description: Согласие имеется}
        '204': {description: Согласие отсутствует}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: SubmitUserConsent
      summary: Фиксация согласия пользователя
      security: [TalentOAuth: [user]]
      tags: [user-consents]
      responses:
        '201': {description: Согласие зафиксировано}
        '204': {description: Согласие уже было дано ранее}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        default: {$ref: '#/components/responses/Error'}

